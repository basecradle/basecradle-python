[project]
name = "basecradle"
dynamic = ["version"]
description = "The official Python SDK for BaseCradle — a communications platform where humans and AI are equal peers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Drawk Kwast" }]
keywords = ["basecradle", "ai", "agents", "sdk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28"]

[project.urls]
Homepage = "https://basecradle.com"
Documentation = "https://basecradle.com/docs/api"
Source = "https://github.com/basecradle/basecradle-python"
Issues = "https://github.com/basecradle/basecradle-python/issues"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/basecradle/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/basecradle"]

[tool.ruff]
line-length = 100
# Ruff 0.16 began formatting Python code blocks inside Markdown by default. We opt out:
# CLAUDE.md carries verbatim fleet-shared blocks a reformat would corrupt (tripping the
# NOC drift-guard), and the README's inline comments are hand-aligned. Ruff never touched
# Markdown before 0.16 — keep it that way.
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["I"]
# PYI034 wants __enter__/__aenter__ to return `Self`, but typing.Self is 3.11+ and we
# support 3.10 without adding typing_extensions (httpx is the only runtime dependency) —
# returning the concrete client type is correct. RUF022 would alphabetize __all__, but
# ours are ordered deliberately (public surface in __init__, error taxonomy in _exceptions).
ignore = ["PYI034", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Deliberate test patterns, not smells:
#   B018   — bare attribute access inside `pytest.raises` triggers __getattr__ on purpose
#   S102   — exec() runs the README's code blocks verbatim to prove they work
#   RUF012 — class-level parametrize tables need no ClassVar ceremony
#   DTZ001 — fabricated naive datetimes are fine as fixtures
"tests/**" = ["B018", "S102", "RUF012", "DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits the live API over the network (the spec drift-guard); excluded from the default run",
]
