[project]
name = "basecradle"
dynamic = ["version"]
description = "The official Python SDK for BaseCradle — an AI Research Lab and Modular Agentic Framework where humans and AI are equal peers — same accounts, same permissions, same API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Drawk Kwast" }]
keywords = ["basecradle", "ai", "agents", "sdk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28"]

[project.urls]
Homepage = "https://basecradle.com"
Documentation = "https://basecradle.com/docs/api"
Source = "https://github.com/basecradle/basecradle-python"
Issues = "https://github.com/basecradle/basecradle-python/issues"

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8", "respx>=0.22", "ruff>=0.16.8"]
# The toolchain that makes the published bytes (#346), held here so uv.lock pins every
# version and every hash of it, hatchling's own dependencies included, and Dependabot's uv
# entry moves them as a reviewable diff the daily scan also reads. Nothing installs this
# group: `uv sync` installs `dev` only. The one build, .github/actions/build-distributions,
# which the release and CI's `build` job both run, installs the locked `uv` wheel by the
# lock's own hashes and exports the rest as hashed constraints for `uv build
# --require-hashes`; CI's setup-uv steps read the same uv version off the lock.
# Every name in [build-system].requires is here with the same specifier, or it would never
# reach the lock and would resolve fresh on every tag; tests/test_workflows.py fails
# otherwise.
build = ["uv>=0.13.6", "hatchling>=1.27"]

# A range, not a pin: this table ships in the sdist, and an exact pin here would bind anyone
# who rebuilds the sdist without build isolation to one hatchling (#346). The release build
# is held by uv.lock instead (the `build` group above). 1.27 is the first hatchling that
# reads PEP 639's `license` and `license-files`, which [project] uses. Dependabot has raised
# this floor before (#146); a raise moves the `build` group's statement in the same change,
# or tests/test_workflows.py fails it.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/basecradle/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/basecradle"]

# py.typed promises every downstream user that these annotations are real, so something
# has to check them -- a promise nothing checks is theater (#229 Part 2). Configured here
# rather than in the CI job's flags, so `uv run mypy` locally and the `types` job cannot
# disagree about what "strict" means.
#
# The baseline is two `# type: ignore[...]` sites in src/ — it was four until #237 made
# the resource core generic — each with a reason above it saying why the code cannot be
# typed instead. Never a per-module or config-level allowance, which would hide whatever
# arrives next in the same file. `strict` includes `warn_unused_ignores`, so an ignore
# that stops being needed becomes an error: the baseline shrinks only by fixing and
# cannot silently grow.
#
# scripts/ is checked too: the daily dependency scan's decisions live there (#315), and the
# repository's own tooling meets the bar its package does.
[tool.mypy]
strict = true
files = ["src/basecradle", "scripts"]

[tool.ruff]
line-length = 100
# Ruff 0.16 began formatting Python code blocks inside Markdown by default. We opt out:
# CLAUDE.md carries verbatim fleet-shared blocks a reformat would corrupt (tripping the
# NOC drift-guard), and the README's inline comments are hand-aligned. Ruff never touched
# Markdown before 0.16 — keep it that way.
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["I"]
# PYI034 wants `Self` from __enter__/__aenter__, but typing.Self is 3.11+ and we support
# 3.10 without adding typing_extensions (httpx is the only runtime dependency) —
# returning the concrete client type is correct. RUF022 would alphabetize __all__, but
# ours are ordered deliberately (public surface in __init__, error taxonomy in
# _exceptions). PYI019 is the same `Self` story, but scoped per-file below rather than
# disabled here: it should keep blocking a needless self-TypeVar everywhere else.
ignore = ["PYI034", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Deliberate test patterns, not smells:
#   B018   — bare attribute access inside `pytest.raises` triggers __getattr__ on purpose
#   S102   — exec() runs the README's code blocks verbatim to prove they work
#   RUF012 — class-level parametrize tables need no ClassVar ceremony
#   DTZ001 — fabricated naive datetimes are fine as fixtures
"tests/**" = ["B018", "S102", "RUF012", "DTZ001"]
# PYI019 would rewrite the resource core's `def filter(self: _R) -> _R` into `-> Self`,
# which is 3.11+ and would mean adding typing_extensions for a 3.10 target. The idiom is
# correct here (#237); the rule stays live everywhere else. `RequestHeaders.copy` is the
# same idiom: a subclass's `copy()` has to be typed as that subclass, not the base.
"src/basecradle/_items.py" = ["PYI019"]
"src/basecradle/_webhooks.py" = ["PYI019"]
"src/basecradle/_headers.py" = ["PYI019"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: reaches the network (the spec drift-guard, the action-pin comment check, and the setup-uv checksum check); excluded from the default run",
]
