version: 2
# The one-week trial @origin approved (basecradle#874): Dependabot proposes a version
# update only once the release is seven days old, so a release pulled or found compromised
# in its first week never arrives here as a Dependabot version-update pull request.
# Seven days is safe because a cooldown never delays a security update: Dependabot's
# security updates are exempt, and the daily osv-scanner scan of uv.lock (#315), which
# reads no cooldown, catches what Dependabot misses (it never moved the transitive pins in
# #316). The other half of the trial is the capital's, in the shared auto-merge: a pull
# request that moves a publish-path tool is not auto-merged and goes to the capital.
# The capital owns the trial's outcome; the handoff that settles it rewrites this comment.
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  # uv moves only with setup-uv (#373). CI installs the locked uv through setup-uv, and
  # drift-guard refuses a uv setup-uv's built-in checksum table does not hold. A uv release
  # always reached Dependabot before a setup-uv release carried it, so every uv bump it
  # opened sat red (#372). Instead, the setup-uv bump moves uv: drift-guard fails it until
  # the newest uv its new table holds is locked in that same pull request, and its failure
  # says the command. tests/test_dependabot.py holds this list to `uv` alone. The ignore
  # covers Dependabot's security updates too; the daily scan of uv.lock (#315) still reads uv.
  ignore:
  - dependency-name: uv
  # The publish path (#346): the `build` dependency group in pyproject.toml and everything
  # it pulls into uv.lock, the packages that make the published bytes. The shared
  # auto-merge sends an update in a group named `publish-path` to the capital rather than
  # merging it (basecradle#874). Exact names, one per package: tests/test_dependabot.py
  # walks the lock from the `build` group and fails while this list differs from what it
  # finds, so a toolchain change that moves the closure moves this list in the same diff.
  groups:
    publish-path:
      patterns:
      - hatchling
      - packaging
      - pathspec
      - pluggy
      - tomli
      - tomlkit
      - trove-classifiers
      - uv
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  # A week's action bumps arrive as one pull request.
  groups:
    github-actions:
      patterns:
      - "*"
  open-pull-requests-limit: 10
