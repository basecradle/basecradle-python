# The release pipeline: tag → build → TestPyPI rehearsal → human approval → PyPI.
#
# Zero stored credentials: PyPI trusts this workflow via OIDC (Trusted Publishing).
# The workflow filename and the environment names (testpypi, pypi) are contractual —
# they match the pending publishers registered on PyPI/TestPyPI (issue #1). Renaming
# any of them breaks the trust relationship.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build the wheel and sdist
        run: uv build
      # A pure inter-job handoff: this artifact exists only to carry the build to
      # the two publish jobs, and its purpose is served the moment PyPI has the
      # wheel. Left unset it inherits GitHub's 90-day default, so every release
      # would strand a stale copy of its dist for three months with nobody
      # deciding to keep it (constitution.md -> How We Build, "whatever creates,
      # cleans up"). 30 days is the shortest end that cannot break a release:
      # GitHub holds a waiting deployment -- the pypi gate the capital actuates --
      # for up to 30 days, and an artifact that expired first would fail
      # publish-pypi's download and force a re-tag.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish-testpypi:
    name: publish to TestPyPI (rehearsal)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/basecradle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The real publish. The pypi environment requires a human approval (Drawk) —
  # the one place in this repository where a manual gate is correct.
  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    environment:
      name: pypi
      url: https://pypi.org/p/basecradle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
