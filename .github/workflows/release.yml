# The release pipeline: tag → build → TestPyPI rehearsal → pypi env-gate → PyPI.
#
# Zero stored credentials: PyPI trusts this workflow via OIDC (Trusted Publishing).
# The workflow filename and the environment names (testpypi, pypi) are contractual —
# they match the pending publishers registered on PyPI/TestPyPI (issue #1). Renaming
# any of them breaks the trust relationship.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # #214 asserts the tag names the version the tree builds, and #216 derives the
      # tag from that tree -- which between them removed the tag's only independent
      # cross-check. A derived tag on a checkout one commit behind main is the RIGHT
      # version on the WRONG commit: built == tagged by construction, so #214's guard
      # is green, the gate is approved, and PyPI publishes a tree missing the last
      # merge, under a filename that can only ever be superseded. Assert the tag is
      # main's tip, and the pipeline can notice (#218).
      #
      # First step in the job, before setup-uv and `uv build`: it reads one sha and
      # needs no toolchain or artifact, so a bad tag fails at the cheapest point.
      # On a tag push actions/checkout leaves HEAD detached at the TAG's commit (not
      # a synthesized merge, as it would for a pull_request event), so HEAD is the
      # thing to compare. `git ls-remote` rather than `git fetch --depth=1`: it
      # answers with the sha alone, transferring no objects and writing no refs into
      # the tree `uv build` is about to package, and it does not care that the
      # checkout is shallow. The explicit refs/heads/main avoids matching a tag of
      # the same name.
      #
      # Two limits, both accepted deliberately, neither silent:
      #  - This is exact-tip equality, so main advancing between the tag push and
      #    this job is a false positive -- including on a "Re-run all jobs" after the
      #    pypi gate (which GitHub holds for up to 30 days, see upload-artifact
      #    below), by which point main has almost certainly moved. Recovery is the
      #    same delete-and-retag as #214's. Accepting any ancestor of main instead
      #    would readmit the one-commit-behind case this step exists to catch.
      #  - It makes "tag main's tip" the only legal release, so the tag has to be cut
      #    BEFORE the next cycle's post-release bump lands -- otherwise the skill's
      #    .dev0 refusal and this guard exclude each other and nothing is taggable.
      #    release-to-pypi's tag step carries that ordering (#218).
      - name: The tag must sit on main's tip
        run: |
          set -euo pipefail

          # Captured, then checked, in two statements on purpose. As one --
          # tip="$(git ls-remote ... | cut -f1)" -- `set -e` plus `pipefail` makes a
          # failed ls-remote abort the step on the assignment itself, so the branch
          # below never runs and the capital sees a bare non-zero exit with no
          # annotation: indistinguishable from a genuinely bad tag, which is the one
          # distinction this branch exists to draw.
          refs="$(git ls-remote origin refs/heads/main || true)"
          tip="$(printf '%s' "$refs" | cut -f1)"

          if [ -z "$tip" ]; then
            echo "::error::Could not read origin's refs/heads/main, so whether this tag is main's tip is unknown -- refusing to publish rather than guessing. Re-run the job if this was a network blip."
            exit 1
          fi

          tagged="$(git rev-parse HEAD)"

          if [ "$tagged" != "$tip" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is at ${tagged:0:7}, but origin/main's tip is ${tip:0:7}. Refusing to publish a tag that is not main's tip."
            echo "::error::A tag behind main is the right version on the wrong commit -- the version guard below cannot see it, because the tree it builds agrees with the tag."
            echo "::error::Recover: git tag -d $GITHUB_REF_NAME ; git push origin :refs/tags/$GITHUB_REF_NAME -- two commands, because a failed local delete must not skip the remote."
            echo "::error::Then re-cut the tag per release-to-pypi's tag step. If main has moved past the release commit, land a fresh release commit at main's tip: this guard cannot accept a tag on history."
            exit 1
          fi

          echo "Tag $GITHUB_REF_NAME is main's tip (${tagged:0:7})."
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build the wheel and sdist
        run: uv build
      # The tag is only a trigger: `uv build` derives the version from
      # src/basecradle/_version.py via [tool.hatch.version], and nothing else here
      # reads the tag. So any tag that disagrees with the tree publishes
      # the wrong version number under the right tag name -- and a PyPI filename
      # can only be superseded by another release, never replaced. The tag is pushed
      # by the capital in a separate turn from the captain who set _version.py, so
      # assert the two agree here, where a mismatch costs a deleted tag rather than
      # a burned version number (#214).
      #
      # Since #216 the release-to-pypi skill's tag step derives the tag from the
      # built wheel instead of having it typed, which takes the typo out of that
      # route. This step still covers what the derivation does not: a tag pushed by
      # any other route, and the sdist, which the skill never reads. It does NOT
      # catch a version that is wrong on both sides at once -- a .dev0 tree, or a
      # mis-bumped _version.py, agrees with its own artifacts and passes here.
      #
      # The artifacts' own filenames are the reading, and BOTH are checked: the
      # publish steps below upload all of dist/, so the sdist reaches PyPI under a
      # filename just as immutable as the wheel's. (`uv version --short`, the other
      # candidate, cannot be used -- it refuses a dynamic project version, which is
      # exactly what hatch gives this project. See #214.)
      - name: The tag must name the version being built
        run: |
          set -euo pipefail
          shopt -s nullglob

          tagged="${GITHUB_REF_NAME#v}"
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)

          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected one wheel and one sdist in dist/, found ${#wheels[@]} and ${#sdists[@]}."
            exit 1
          fi

          # Both guards in this job compare two things that AGREE with each other --
          # the tag against the artifacts here, the tag's commit against main's tip
          # above -- so neither can ask whether the agreed-upon version is one we ever
          # meant to publish. main's steady state BETWEEN releases is X.Y.Z.dev0, and
          # the tag is now derived from the tree (#216), so a run at the wrong moment
          # produces a .dev0 tag that matches its own artifacts perfectly, sails through
          # both guards, and lands a dev build on a PyPI filename that can never be
          # replaced. Refuse anything that is not a final release (#220).
          #
          # Anchored, because a character class accepts 1.2.3.4, 0.12, 0 and "...".
          # This SDK has never published a prerelease; the day one is planned, widen
          # this deliberately in the same PR that plans it.
          #
          # Checking the TAG is sufficient: the loop below refuses any artifact whose
          # version differs from it, so constraining the tag constrains what ships.
          if [[ ! $tagged =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME names version '$tagged', which is not a final X.Y.Z release. Refusing to publish it -- a PyPI filename can never be replaced."
            echo "::error::A .dev0 means the tag was cut while main was between releases: the release PR had not merged, or the post-release bump already moved past it. Neither guard in this job can catch that on its own, because such a tag agrees with the tree it builds."
            echo "::error::Recover: git tag -d $GITHUB_REF_NAME ; git push origin :refs/tags/$GITHUB_REF_NAME -- then re-cut it on a release commit per the release-to-pypi skill."
            exit 1
          fi

          mismatched=0
          for artifact in "${wheels[@]}" "${sdists[@]}"; do
            file="$(basename "$artifact")"
            built="$(basename "$file" .tar.gz | cut -d- -f2)"
            if [ "$built" != "$tagged" ]; then
              echo "::error::Tag $GITHUB_REF_NAME builds $file -- version $built, not $tagged. Refusing to publish a mismatch."
              mismatched=1
            fi
          done

          if [ "$mismatched" -ne 0 ]; then
            echo "::error::Recover: delete the tag, then fix whichever side is actually wrong."
            echo "::error::Delete it: git tag -d TAG ; git push origin :refs/tags/TAG -- two commands, because a failed local delete must not skip the remote."
            echo "::error::Tag wrong? Re-run the release-to-pypi skill's tag step, which derives the tag from the built wheel. Do not retype it."
            echo "::error::Tree wrong (mis-bump, or a PEP 440 normalization difference)? src/basecradle/_version.py needs a captain PR -- the capital does not write to this repo."
            exit 1
          fi

          echo "Tag $GITHUB_REF_NAME matches both built artifacts (version $tagged)."
      # A pure inter-job handoff: this artifact exists only to carry the build to
      # the two publish jobs, and its purpose is served the moment PyPI has the
      # wheel. Left unset it inherits GitHub's 90-day default, so every release
      # would strand a stale copy of its dist for three months with nobody
      # deciding to keep it (constitution.md -> How We Build, "whatever creates,
      # cleans up"). 30 days is the shortest end that cannot break a release:
      # GitHub holds a waiting deployment -- the pypi gate the capital actuates --
      # for up to 30 days, and an artifact that expired first would fail
      # publish-pypi's download and force a re-tag.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish-testpypi:
    name: publish to TestPyPI (rehearsal)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/basecradle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The real publish. The pypi environment gate is actuated by the capital using
  # its operator credential — not by a founder, who is out of the publish loop
  # (CLAUDE.md -> Releasing). So this is a deliberate gate, but not a human gate:
  # nothing here waits on @origin, and it must never be announced as a human gate.
  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    environment:
      name: pypi-prod
      url: https://pypi.org/p/basecradle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
