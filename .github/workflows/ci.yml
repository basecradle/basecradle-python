name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  # The spec drift-guard: fails when the live API has endpoints the SDK doesn't cover.
  # The only job that reaches the live platform (a single GET of the public spec);
  # actionlint below also leaves the runner, but only to a pinned linter image.
  drift:
    name: drift-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Check the SDK covers the live API
        run: uv run pytest -m live

  # Fleet Bot Identity: a commit authored by this repo's bot carries no
  # Co-Authored-By trailer — the commit author already *is* the agent (#187).
  # The rule lived in an always-loaded file and was still violated five times
  # across three sessions, so CI blocks the merge rather than trusting the text.
  trailers:
    name: commit-trailers
    runs-on: ubuntu-latest
    steps:
      # Both steps are gated on the event rather than the job: a job that
      # *skips* would fail the CI gate below, which counts a skip as a failure.
      # All-steps-skipped still reports success.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Walking base..head needs both ends present in the clone.
          fetch-depth: 0
      - name: No Co-Authored-By on bot commits
        if: github.event_name == 'pull_request'
        env:
          BOT: basecradle-python-ai[bot]
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Single source of truth: the identity is CLAUDE.md's to state. If it
          # changes there and not here, the author filter below would quietly
          # match nothing and the guard would pass everything — fail instead.
          grep -qF "$BOT" CLAUDE.md || {
            echo "::error::$BOT is no longer the commit-author in CLAUDE.md -> Fleet Bot Identity. Update this check to match."
            exit 1
          }

          # Only the commits this PR contributes: reachable from the head and
          # not from the base branch. The live base ref is excluded alongside
          # the event's point-in-time base.sha, so a branch that merged main in
          # never re-litigates main's own commits — GitHub's squash-merge adds
          # a self-co-author trailer to every one of them, and they can never
          # be rewritten. For the same reason this must never be widened to
          # push events.
          excludes=("$BASE_SHA")
          if git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF" >/dev/null; then
            excludes+=("refs/remotes/origin/$BASE_REF")
          fi

          bad=()
          shas=$(git log --format=%H "$HEAD_SHA" --not "${excludes[@]}")
          for sha in $shas; do
            # Each git call is its own assignment so that a failure trips
            # set -e; inside a `case` word or before `||` it would not, and the
            # commit would be skipped unexamined.
            author=$(git show -s --format='%an <%ae>' "$sha")
            # Quoted, so the [bot] brackets stay literal and are not a glob class.
            case "$author" in *"$BOT"*) ;; *) continue ;; esac
            # The whole message, not git's %(trailers:...) — that parses only
            # the final paragraph, so a trailer with any paragraph after it
            # slips through. A line-anchored scan fails closed instead.
            message=$(git show -s --format=%B "$sha")
            if printf '%s\n' "$message" | grep -qi '^Co-Authored-By:'; then
              bad+=("$(git show -s --format='%h %s' "$sha")")
            fi
          done

          for commit in "${bad[@]}"; do
            echo "::error::Fleet Bot Identity (#187): $commit carries a Co-Authored-By trailer. A commit authored by $BOT carries none — rewrite the message without it."
          done
          [ ${#bad[@]} -eq 0 ]

  # release.yml runs only on a `v*` tag push, so nothing else in CI ever parses it --
  # and it is where both publish guards live (#214, #218). A mis-indented step or a
  # malformed expression would first surface against a real tag, at the one moment a
  # broken pipeline costs a burned version number. Lint every workflow on every PR
  # instead (#224).
  #
  # Pinned by DIGEST, not by tag and not @latest: a linter that moves under us turns an
  # unrelated PR red, and "the lint changed" is the one CI failure nobody's diff
  # explains. The image is the pin for all three linters at once -- actionlint ships
  # shellcheck and pyflakes inside it, so the shell in every `run:` block is checked
  # against a fixed shellcheck rather than whatever `ubuntu-latest` happens to carry
  # this week. Bumping means one digest, with the version comment beside it.
  #
  # Two passes, because two of this repo's workflows are not this repo's to fix (#233).
  # `needs-human-alert.yml` and `dependabot-auto-merge.yml` are carried byte-identical
  # from the capital and byte-diffed by the NOC drift-guard, so a finding in one of them
  # has no in-repo remedy -- editing it would take the fleet's shared law out of sync.
  # Blocking them would put every PR in the repo behind a file nobody here may touch.
  #
  # So: a blocking pass over the workflows this repo owns, and an advisory pass over the
  # stubs that surfaces findings without gating them. The exclusion list names the SHARED
  # files, never the owned ones, so a workflow added to this repo later is covered by the
  # blocking pass without anybody editing this job.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the gate now needs this job; never let it wedge every merge
    env:
      # rhysd/actionlint 1.7.12
      ACTIONLINT_IMAGE: "rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667"
      # Derived from CLAUDE.md below rather than trusted from here -- this is the value
      # the cross-check asserts against, not a second source of truth.
      SHARED_STUBS: "needs-human-alert.yml dependabot-auto-merge.yml"
    steps:
      - uses: actions/checkout@v7
      - name: Pull the linter
        # Retried: one transient registry 5xx would otherwise redden a PR that touched
        # no workflow file -- the same unexplainable failure the digest pin avoids.
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if docker pull --quiet "$ACTIONLINT_IMAGE"; then
              exit 0
            fi
            echo "pull failed (attempt $attempt/3)" >&2
            sleep $((attempt * 5))
          done

          echo "::error::Could not pull $ACTIONLINT_IMAGE after 3 attempts."
          exit 1
      - name: Every linter actionlint delegates to must be present
        # actionlint shells out for the shell and python checks and simply SKIPS the
        # rule when the tool is missing -- exit 0, no warning, no mention. Measured
        # locally: the same workflow with one unquoted expansion exits 1 with
        # shellcheck on PATH and 0 without it. So assert on actionlint's own report of
        # what it disabled, rather than on a PATH lookup standing in for it: that keeps
        # holding if it ever grows another reason to disable a rule.
        run: |
          set -euo pipefail

          disabled="$(docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" \
            -verbose 2>&1 >/dev/null | grep 'was disabled' | sort -u || true)"

          if [ -n "$disabled" ]; then
            echo "$disabled" >&2
            echo "::error::actionlint disabled a rule because its tool is missing from the image, so those checks would pass silently. See the log above."
            exit 1
          fi

          echo "actionlint has every delegated linter; no rule disabled."
      - name: SHARED_STUBS must still be what CLAUDE.md says is shared
        # Single source of truth: which workflows are the capital's is CLAUDE.md's to
        # state (-> Propagation). If a third shared workflow is propagated here and this
        # list is not updated, it falls into the blocking pass below -- one finding in a
        # file this repo may not edit, and every PR is red with no in-repo remedy, which
        # is the outcome this job exists to prevent. Fail here instead. Same pattern, and
        # the same reason, as the trailers job's CLAUDE.md check above.
        run: |
          set -euo pipefail

          declared="$(grep -E '^Seven shared artifacts are carried verbatim' CLAUDE.md \
            | grep -oE '\.github/workflows/[a-z-]+\.yml' | sed 's|.*/||' | sort -u)"
          configured="$(printf '%s' "$SHARED_STUBS" | tr ' ' '\n' | sed '/^$/d' | sort -u)"

          if [ "$declared" != "$configured" ]; then
            echo "::error::SHARED_STUBS and CLAUDE.md -> Propagation disagree about which workflows are the capital's."
            echo "::error::CLAUDE.md names: $(echo "$declared" | tr '\n' ' ')"
            echo "::error::This job configures: $(echo "$configured" | tr '\n' ' ')"
            echo "::error::Update SHARED_STUBS to match, or a shared stub is being gated (or an owned workflow is not)."
            exit 1
          fi

          echo "SHARED_STUBS agrees with CLAUDE.md: $(echo "$configured" | tr '\n' ' ')"
      - name: Lint the workflows this repo owns
        # The blocking pass. -format so findings land as annotations on the PR's changed
        # files, the way this repo's other guards report (the trailers job above,
        # release.yml's two publish guards). Default output only reaches whoever opens
        # the job log.
        run: |
          set -euo pipefail

          owned=()
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$workflow" ] || continue
            # ${var##*/} rather than $(basename): a command substitution inside a `case`
            # word is exempt from `set -e`, so a failing basename would collapse the
            # pattern and silently sort a shared stub into `owned` (see the trailers
            # job's note on the same trap).
            case " $SHARED_STUBS " in *" ${workflow##*/} "*) continue ;; esac
            owned+=("$workflow")
          done

          if [ ${#owned[@]} -eq 0 ]; then
            echo "::error::No owned workflows to lint. Either the glob broke or SHARED_STUBS now covers everything."
            exit 1
          fi

          printf 'linting (blocking): %s\n' "${owned[@]}"

          format=$'{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'

          docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" \
            -format "$format" "${owned[@]}"
      - name: Lint the capital's shared stubs (advisory)
        # Advisory, and advisory means the step SUCCEEDS on a finding -- it does not lean
        # on `continue-on-error` to hide one. That distinction is the point: exit 1 from
        # actionlint means findings, and exit 3 means it could not run at all (bad path,
        # bad template, docker failure). Blanket-swallowing both would let this pass stop
        # working permanently and invisibly, which is the failure the sibling
        # disabled-linter check above exists to refuse.
        #
        # `continue-on-error` stays as the backstop #233 asked for, so a finding can
        # never gate the repo even if this script is wrong.
        #
        # When a stub does draw a finding, the response is a `needs-capital` report on
        # this repo naming the file and the rule -- NEVER an edit. It also goes to the
        # run summary, because these files never appear in a PR diff, so an annotation
        # alone would surface nowhere.
        continue-on-error: true
        run: |
          set -euo pipefail

          stubs=()
          missing=()
          for stub in $SHARED_STUBS; do
            if [ -e ".github/workflows/$stub" ]; then
              stubs+=(".github/workflows/$stub")
            else
              missing+=("$stub")
            fi
          done

          # CLAUDE.md -> Propagation: every builder repo carries all of them. A missing
          # one is a dropped propagation, not a reason to report success.
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Shared stub(s) missing from this repo: ${missing[*]}. CLAUDE.md -> Propagation says every builder repo carries them; re-sync from the capital."
            exit 1
          fi

          printf 'linting (advisory): %s\n' "${stubs[@]}"

          format=$'{{range $err := .}}::warning file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}} -- shared artifact: report to the capital with needs-capital, never edit it here.\n{{end}}'

          status=0
          docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" \
            -format "$format" "${stubs[@]}" || status=$?

          case "$status" in
            0)
              echo "No findings in the capital's stubs."
              ;;
            1)
              {
                echo "### actionlint findings in the capital's shared stubs"
                echo
                echo "These are **advisory** -- this repo carries these files verbatim and may not edit them."
                echo "Report them to the capital with \`needs-capital\`, naming the file and the rule."
                echo "See the annotations on this run for the specific lines."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Findings reported above as warnings; the gate is deliberately not blocked."
              ;;
            *)
              echo "::error::actionlint exited $status on the shared stubs -- it could not run, which is not a finding. This advisory pass is broken, not clean."
              exit "$status"
              ;;
          esac

  # py.typed is a promise to every downstream user that these annotations are real, and a
  # promise nothing checks is theater (CLAUDE.md -> Stack). Flags live in pyproject.toml,
  # so this job and a local `uv run mypy` cannot disagree about them (#229 Part 2).
  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Type-check
        run: uv run mypy

  # The gate: the single required status check in branch protection.
  # Adding or dropping Python versions never requires a ruleset change.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test, drift, trailers, actionlint, types]
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        # A skipped job must fail the gate too — GitHub treats skipped
        # required checks as passing, which would bypass CI entirely.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        continue-on-error: true
        run: exit 1
